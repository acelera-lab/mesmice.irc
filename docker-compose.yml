services:
  server:
    build: .
    container_name: mesmice-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://mesmice:${DB_PASSWORD:-mesmice}@postgres:5432/mesmice
      - HTTP_PORT=5001
      - TCP_PORT=5002
      - LOG_LEVEL=info
    ports:
      - '5001:5001'
      - '5002:5002'
    volumes:
      - mesmice-data:/data
    networks:
      - mesmice-net
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5001/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: mesmice-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mesmice
      - POSTGRES_PASSWORD=${DB_PASSWORD:-mesmice}
      - POSTGRES_DB=mesmice
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - mesmice-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mesmice']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mesmice-data:
  postgres-data:

networks:
  mesmice-net:
    driver: bridge
